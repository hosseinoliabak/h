# Cache execution results per page, keyed on a hash of the .qmd source. A page
# whose source has not changed is replayed from _freeze/ instead of running its
# Python again, so a full render only re-executes the pages actually edited.
# CAVEAT: the hash covers the .qmd only. Editing a helper module
# (lab_utils_common.py, lab_utils_multi.py, utilsw3.py, deeplearning.mplstyle)
# or a dataset does NOT bust the cache. Force those pages by deleting their
# folder under _freeze/ and rendering again.
execute:
  freeze: auto

