name: Cleanup Pastebin Rooms

on:
  schedule:
    - cron: '0 * * * *'  # Every hour
  workflow_dispatch: {}   # Allow manual trigger

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete stale rooms
        env:
          FIREBASE_DB_URL: https://oliabak-paste-default-rtdb.firebaseio.com
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          pip install --quiet google-auth requests

          python3 <<'PY'
          import json, os, time, requests
          from google.oauth2 import service_account
          from google.auth.transport.requests import Request

          sa_info = json.loads(os.environ['FIREBASE_SERVICE_ACCOUNT'])
          credentials = service_account.Credentials.from_service_account_info(
              sa_info,
              scopes=['https://www.googleapis.com/auth/firebase.database',
                      'https://www.googleapis.com/auth/userinfo.email']
          )
          credentials.refresh(Request())

          DB = os.environ['FIREBASE_DB_URL']
          session = requests.Session()
          session.headers.update({'Authorization': 'Bearer ' + credentials.token})

          NOW = int(time.time() * 1000)
          IDLE_MS = 60 * 60 * 1000              # grace period for a room with nobody in it
          STALE_MEMBER_MS = 12 * 60 * 60 * 1000  # a member that stopped checking in is not real
          MAX_ROOMS = 5000                       # backstop so one run cannot be made to hang

          def get(path, **params):
              r = session.get(DB + '/' + path + '.json', params=params, timeout=30)
              r.raise_for_status()
              return r.json()

          def delete(path):
              r = session.delete(DB + '/' + path + '.json', timeout=30)
              r.raise_for_status()

          def live_members(root, name):
              """Count members that have checked in recently.

              Presence is refreshed by the page on a timer, so a member entry that
              has gone quiet for STALE_MEMBER_MS is either a crashed tab or a forged
              entry written to keep a room from being collected. Either way it does
              not count as somebody using the room.
              """
              members = get(root + '/' + name + '/members')
              if not isinstance(members, dict):
                  return 0
              live = 0
              for member in members.values():
                  if not isinstance(member, dict):
                      continue
                  joined = member.get('joinedAt')
                  if isinstance(joined, (int, float)) and (NOW - joined) <= STALE_MEMBER_MS:
                      live += 1
              return live

          def sweep(root):
              # A shallow read returns room names only. A full read would pull every
              # paste, image, and uploaded file through this job on every run.
              names = get(root, shallow='true')
              names = list(names) if isinstance(names, dict) else []
              total = len(names)
              capped = total > MAX_ROOMS
              if capped:
                  names = names[:MAX_ROOMS]

              # Room names are never printed. A name is the only thing standing
              # between a stranger and a room's contents, and this repository is
              # public, so its Actions logs are world-readable and kept for
              # months. The position in the run is enough to follow what
              # happened without handing out a key to a room somebody recreates
              # under the same name tomorrow.
              deleted = 0
              for i, name in enumerate(names, 1):
                  try:
                      if live_members(root, name):
                          continue
                      last = get(root + '/' + name + '/lastDisconnect')
                      if isinstance(last, (int, float)) and last > 0:
                          idle = NOW - last
                          if idle > IDLE_MS:
                              delete(root + '/' + name)
                              deleted += 1
                              print('deleted %s #%d (idle %d min)' % (root, i, idle // 60000))
                      else:
                          delete(root + '/' + name)
                          deleted += 1
                          print('deleted %s #%d (no live members, no disconnect stamp)' % (root, i))
                  except Exception as err:
                      print('skipped %s #%d: %s' % (root, i, err))

              if capped:
                  print('WARNING: %s holds %d rooms, only the first %d were checked this run.'
                        % (root, total, MAX_ROOMS))
              print('%s: %d of %d room(s) removed.' % (root, deleted, total))
              return deleted

          removed = sweep('rooms') + sweep('clipboard-rooms')
          print('No stale rooms found.' if removed == 0 else 'Cleaned up %d room(s).' % removed)
          PY
