<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 380" role="img" aria-labelledby="unet-intuition-title unet-intuition-desc" style="max-width:100%;max-height:380px;">
  <title id="unet-intuition-title">U-Net compression, expansion, and skip connections</title>
  <desc id="unet-intuition-desc">Activations narrow into a small contextual representation and expand to a segmentation map. Skip connections carry high-resolution features across the U shape.</desc>
  <defs><marker id="unet-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#555"></path></marker></defs>
  <text x="168" y="39" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold" fill="#333">compress</text>
  <text x="813" y="39" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold" fill="#333">expand</text>
  <g stroke="#fff" stroke-width="2">
    <rect x="62" y="83" width="70" height="205" fill="#C8CED8"></rect><rect x="201" y="111" width="70" height="155" fill="#7ED4E6"></rect><rect x="340" y="143" width="70" height="95" fill="#7ED4E6"></rect><rect x="479" y="166" width="70" height="50" fill="#7ED4E6"></rect>
    <rect x="618" y="143" width="70" height="95" fill="#7ED4E6"></rect><rect x="757" y="111" width="70" height="155" fill="#7ED4E6"></rect><rect x="896" y="83" width="35" height="205" fill="#F49AC9"></rect>
  </g>
  <g stroke="#555" stroke-width="3" fill="none" marker-end="url(#unet-arrow)"><path d="M142 185 H190"></path><path d="M281 188 H329"></path><path d="M420 190 H468"></path><path d="M559 190 H607"></path><path d="M698 188 H746"></path><path d="M837 185 H884"></path></g>
  <g stroke="#888" stroke-width="3" stroke-dasharray="7 5" fill="none" marker-end="url(#unet-arrow)"><path d="M132 80 C295 18 685 18 757 108"></path><path d="M271 109 C390 61 615 61 618 141"></path><path d="M410 142 C490 113 597 113 618 143"></path></g>
  <g font-family="sans-serif" font-size="15" fill="#555"><text x="96" y="316" text-anchor="middle">high resolution</text><text x="514" y="244" text-anchor="middle">context</text><text x="914" y="316" text-anchor="middle">pixel labels</text><text x="485" y="354" text-anchor="middle">dashed arrows copy high-resolution features to the expanding side</text></g>
</svg>