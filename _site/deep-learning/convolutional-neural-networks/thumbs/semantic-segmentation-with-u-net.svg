<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 315" role="img" aria-labelledby="seg-title seg-desc" style="max-width:100%;max-height:315px;">
  <title id="seg-title">Object detection compared with semantic segmentation</title>
  <desc id="seg-desc">The same street scene has one result made of bounding boxes and another result made of labelled pixels for buildings, car, and road.</desc>
  <defs><marker id="seg-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#777"></path></marker></defs>
  <g transform="translate(28 45)">
    <rect width="260" height="195" rx="8" fill="#DCE8F3" stroke="#AEB7C0" stroke-width="2"></rect>
    <path d="M0 130 L76 90 L138 127 L202 80 L260 120 V195 H0Z" fill="#C8CED8"></path>
    <path d="M0 160 L64 142 L140 164 L208 131 L260 147 V195 H0Z" fill="#6F8D58"></path>
    <rect x="98" y="113" width="76" height="43" rx="8" fill="#7ED4E6"></rect><circle cx="119" cy="155" r="11" fill="#333"></circle><circle cx="154" cy="155" r="11" fill="#333"></circle>
    <text x="130" y="223" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#333">input image</text>
  </g>
  <path d="M310 142 H403" stroke="#777" stroke-width="3" marker-end="url(#seg-arrow)"></path>
  <g transform="translate(425 45)">
    <rect width="220" height="195" rx="8" fill="#DCE8F3" stroke="#AEB7C0" stroke-width="2"></rect>
    <path d="M0 130 L70 90 L126 127 L180 80 L220 120 V195 H0Z" fill="#C8CED8"></path>
    <path d="M0 160 L54 142 L121 164 L177 131 L220 147 V195 H0Z" fill="#6F8D58"></path>
    <rect x="82" y="113" width="68" height="43" rx="8" fill="#7ED4E6"></rect><circle cx="101" cy="155" r="10" fill="#333"></circle><circle cx="132" cy="155" r="10" fill="#333"></circle>
    <rect x="75" y="104" width="85" height="62" fill="none" stroke="#CC0000" stroke-width="4"></rect>
    <text x="110" y="223" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#333">object detection</text>
  </g>
  <path d="M670 142 H753" stroke="#777" stroke-width="3" marker-end="url(#seg-arrow)"></path>
  <g transform="translate(774 45)">
    <rect width="140" height="195" rx="8" fill="#F8F9FA" stroke="#AEB7C0" stroke-width="2"></rect>
    <path d="M0 0 H140 V121 L110 121 V91 H76 V130 H43 V100 H0Z" fill="#C8CED8"></path>
    <path d="M0 113 H43 V132 H76 V95 H110 V124 H140 V195 H0Z" fill="#7ED4E6"></path>
    <path d="M0 158 L41 142 L79 158 L111 135 L140 146 V195 H0Z" fill="#6F8D58"></path>
    <text x="70" y="223" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#333">pixel labels</text>
  </g>
  <g font-family="sans-serif" font-size="15" fill="#333"><rect x="453" y="278" width="14" height="14" fill="#C8CED8"></rect><text x="474" y="290">building</text><rect x="556" y="278" width="14" height="14" fill="#7ED4E6"></rect><text x="577" y="290">car</text><rect x="638" y="278" width="14" height="14" fill="#6F8D58"></rect><text x="659" y="290">road</text></g>
</svg>