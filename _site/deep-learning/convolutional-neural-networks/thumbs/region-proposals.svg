<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 310" role="img" aria-labelledby="region-title region-desc" style="max-width:100%;max-height:310px;">
  <title id="region-title">Region proposals focus a detector on a few candidate regions</title>
  <desc id="region-desc">An image produces several candidate regions, and only those regions are inspected by a convolutional neural network.</desc>
  <defs><marker id="region-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#777"></path></marker></defs>
  <rect x="30" y="52" width="220" height="190" rx="8" fill="#E9EEF2" stroke="#AEB7C0" stroke-width="2"></rect>
  <path d="M30 188 Q85 135 142 177 T250 150 V242 H30Z" fill="#91B878"></path>
  <rect x="72" y="108" width="58" height="52" rx="8" fill="#7ED4E6"></rect><circle cx="91" cy="127" r="7" fill="#333"></circle><circle cx="114" cy="127" r="7" fill="#333"></circle>
  <rect x="168" y="84" width="38" height="87" rx="12" fill="#F49AC9"></rect><circle cx="187" cy="73" r="15" fill="#F49AC9"></circle>
  <rect x="55" y="88" width="90" height="92" fill="none" stroke="#CC7000" stroke-width="4"></rect>
  <rect x="155" y="59" width="67" height="130" fill="none" stroke="#CC0000" stroke-width="4"></rect>
  <rect x="48" y="195" width="105" height="29" fill="none" stroke="#6A0DAD" stroke-width="4"></rect>
  <text x="140" y="275" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#333">input image</text>
  <path d="M270 147 H370" stroke="#777" stroke-width="3" marker-end="url(#region-arrow)"></path>
  <text x="320" y="124" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#555">segment into</text>
  <text x="320" y="144" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#555">candidate blobs</text>
  <rect x="391" y="52" width="185" height="190" rx="8" fill="#F8F9FA" stroke="#AEB7C0" stroke-width="2"></rect>
  <path d="M407 187 Q450 137 500 178 T560 154 V226 H407Z" fill="#91B878"></path>
  <rect x="428" y="109" width="48" height="43" rx="7" fill="#7ED4E6"></rect><rect x="510" y="84" width="32" height="80" rx="11" fill="#F49AC9"></rect>
  <path d="M425 86 Q463 70 481 104 Q496 78 527 92 Q549 107 537 134 Q517 160 481 152 Q451 162 425 139 Q413 112 425 86Z" fill="#C8CED8" opacity=".8"></path>
  <text x="483" y="275" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#333">a few proposals</text>
  <path d="M596 147 H684" stroke="#777" stroke-width="3" marker-end="url(#region-arrow)"></path>
  <rect x="705" y="66" width="175" height="154" rx="12" fill="#2C3E50"></rect>
  <text x="792" y="111" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold" fill="#fff">CNN detector</text>
  <line x1="730" y1="130" x2="855" y2="130" stroke="#AEB7C0" stroke-width="2"></line>
  <text x="792" y="161" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#fff">class label</text>
  <text x="792" y="190" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#fff">refined box</text>
  <text x="792" y="275" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#333">inspect only proposals</text>
</svg>