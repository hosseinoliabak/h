<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 510" role="img" aria-labelledby="unet-architecture-title unet-architecture-desc" style="max-width:100%;max-height:510px;">
  <title id="unet-architecture-title">Complete U-Net architecture</title>
  <desc id="unet-architecture-desc">A U-shaped network uses convolution and max pooling on the left, transpose convolution and skip connections on the right, and a final one by one convolution to make a segmentation map.</desc>
  <defs><marker id="arch-black" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#333"></path></marker><marker id="arch-green" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#1E6B3E"></path></marker><marker id="arch-grey" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#888"></path></marker></defs>
  <g stroke="#fff" stroke-width="2"><rect x="44" y="88" width="60" height="270" fill="#C8CED8"></rect><rect x="188" y="119" width="70" height="208" fill="#7ED4E6"></rect><rect x="342" y="157" width="80" height="133" fill="#7ED4E6"></rect><rect x="506" y="192" width="90" height="62" fill="#7ED4E6"></rect><rect x="680" y="157" width="80" height="133" fill="#7ED4E6"></rect><rect x="834" y="119" width="70" height="208" fill="#7ED4E6"></rect><rect x="978" y="88" width="60" height="270" fill="#F49AC9"></rect></g>
  <g fill="none" stroke="#333" stroke-width="3" marker-end="url(#arch-black)"><path d="M114 223 H174"></path><path d="M268 223 H328"></path><path d="M432 223 H492"></path><path d="M770 223 H820"></path><path d="M914 223 H964"></path></g>
  <g fill="none" stroke="#1E6B3E" stroke-width="3" marker-end="url(#arch-green)"><path d="M606 223 H666"></path><path d="M760 223 H820"></path><path d="M904 223 H964"></path></g>
  <g fill="none" stroke="#888" stroke-width="3" stroke-dasharray="7 5" marker-end="url(#arch-grey)"><path d="M104 83 C305 17 716 17 834 116"></path><path d="M258 116 C400 60 670 60 680 154"></path><path d="M422 156 C505 121 628 121 680 156"></path></g>
  <path d="M1048 223 H1080" stroke="#CC00A0" stroke-width="4" marker-end="url(#arch-black)"></path>
  <g font-family="sans-serif" fill="#333" text-anchor="middle"><text x="74" y="385" font-size="16">h × w × 3</text><text x="223" y="353" font-size="15">conv + ReLU</text><text x="382" y="316" font-size="15">max pool</text><text x="551" y="280" font-size="15">small, deep</text><text x="720" y="316" font-size="15">transpose conv</text><text x="869" y="353" font-size="15">conv + ReLU</text><text x="1008" y="385" font-size="16">h × w × n classes</text><text x="1094" y="201" font-size="14" fill="#CC00A0">1 by 1</text><text x="1094" y="219" font-size="14" fill="#CC00A0">conv</text></g>
  <g font-family="sans-serif" font-size="15" fill="#555"><line x1="97" y1="442" x2="129" y2="442" stroke="#333" stroke-width="3"></line><text x="137" y="447">convolution plus ReLU or max pool</text><line x1="437" y1="442" x2="469" y2="442" stroke="#1E6B3E" stroke-width="3"></line><text x="477" y="447">transpose convolution</text><line x1="697" y1="442" x2="729" y2="442" stroke="#888" stroke-width="3" stroke-dasharray="7 5"></line><text x="737" y="447">skip connection</text></g>
</svg>