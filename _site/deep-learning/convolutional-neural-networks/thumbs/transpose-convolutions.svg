<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 360" role="img" aria-labelledby="transpose-title transpose-desc" style="max-width:100%;max-height:360px;">
  <title id="transpose-title">How a transpose convolution grows an activation grid</title>
  <desc id="transpose-desc">Each entry in a two by two input scales a three by three filter and places it on a larger output. Overlapping contributions are added.</desc>
  <defs><marker id="transpose-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#777"></path></marker></defs>
  <text x="122" y="38" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="bold" fill="#333">input activations</text>
  <g transform="translate(62 65)" font-family="sans-serif" font-size="22" text-anchor="middle">
    <rect width="60" height="60" fill="#C8CED8" stroke="#fff" stroke-width="2"></rect><rect x="60" width="60" height="60" fill="#C8CED8" stroke="#fff" stroke-width="2"></rect><rect y="60" width="60" height="60" fill="#C8CED8" stroke="#fff" stroke-width="2"></rect><rect x="60" y="60" width="60" height="60" fill="#C8CED8" stroke="#fff" stroke-width="2"></rect>
    <text x="30" y="39">2</text><text x="90" y="39">1</text><text x="30" y="99">3</text><text x="90" y="99">2</text>
  </g>
  <text x="122" y="215" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#555">2 by 2</text>
  <path d="M210 126 H322" stroke="#777" stroke-width="3" marker-end="url(#transpose-arrow)"></path>
  <text x="266" y="103" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#555">scale a 3 by 3 filter</text>
  <text x="266" y="148" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#555">stride 2</text>
  <g transform="translate(348 65)">
    <rect width="45" height="45" fill="#F49AC9" opacity=".55"></rect><rect x="45" width="45" height="45" fill="#F49AC9" opacity=".55"></rect><rect x="90" width="45" height="45" fill="#F49AC9" opacity=".55"></rect>
    <rect y="45" width="45" height="45" fill="#F49AC9" opacity=".55"></rect><rect x="45" y="45" width="45" height="45" fill="#F49AC9" opacity=".55"></rect><rect x="90" y="45" width="45" height="45" fill="#F49AC9" opacity=".55"></rect>
    <rect y="90" width="45" height="45" fill="#F49AC9" opacity=".55"></rect><rect x="45" y="90" width="45" height="45" fill="#F49AC9" opacity=".55"></rect><rect x="90" y="90" width="45" height="45" fill="#F49AC9" opacity=".55"></rect>
    <text x="68" y="161" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#555">one scaled filter</text>
  </g>
  <path d="M520 126 H626" stroke="#777" stroke-width="3" marker-end="url(#transpose-arrow)"></path>
  <text x="574" y="103" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#555">place each scaled filter</text>
  <text x="574" y="148" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#555">and add overlaps</text>
  <text x="787" y="38" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="bold" fill="#333">larger output</text>
  <g transform="translate(697 65)">
    <rect width="45" height="45" fill="#7ED4E6" stroke="#fff" stroke-width="2"></rect><rect x="45" width="45" height="45" fill="#7ED4E6" stroke="#fff" stroke-width="2"></rect><rect x="90" width="45" height="45" fill="#F49AC9" stroke="#fff" stroke-width="2"></rect><rect x="135" width="45" height="45" fill="#F49AC9" stroke="#fff" stroke-width="2"></rect>
    <rect y="45" width="45" height="45" fill="#7ED4E6" stroke="#fff" stroke-width="2"></rect><rect x="45" y="45" width="45" height="45" fill="#CC7000" stroke="#fff" stroke-width="2"></rect><rect x="90" y="45" width="45" height="45" fill="#CC7000" stroke="#fff" stroke-width="2"></rect><rect x="135" y="45" width="45" height="45" fill="#F49AC9" stroke="#fff" stroke-width="2"></rect>
    <rect y="90" width="45" height="45" fill="#7ED4E6" stroke="#fff" stroke-width="2"></rect><rect x="45" y="90" width="45" height="45" fill="#CC7000" stroke="#fff" stroke-width="2"></rect><rect x="90" y="90" width="45" height="45" fill="#CC7000" stroke="#fff" stroke-width="2"></rect><rect x="135" y="90" width="45" height="45" fill="#F49AC9" stroke="#fff" stroke-width="2"></rect>
    <rect y="135" width="45" height="45" fill="#7ED4E6" stroke="#fff" stroke-width="2"></rect><rect x="45" y="135" width="45" height="45" fill="#7ED4E6" stroke="#fff" stroke-width="2"></rect><rect x="90" y="135" width="45" height="45" fill="#F49AC9" stroke="#fff" stroke-width="2"></rect><rect x="135" y="135" width="45" height="45" fill="#F49AC9" stroke="#fff" stroke-width="2"></rect>
  </g>
  <text x="787" y="270" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#555">4 by 4 after removing padding</text>
  <rect x="697" y="297" width="14" height="14" fill="#7ED4E6"></rect><text x="719" y="310" font-family="sans-serif" font-size="14" fill="#555">one contribution</text><rect x="805" y="297" width="14" height="14" fill="#CC7000"></rect><text x="827" y="310" font-family="sans-serif" font-size="14" fill="#555">overlap added</text>
</svg>