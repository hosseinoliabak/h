<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 490" style="width:75%;max-width:100%;height:auto;" role="img" aria-label="The differential privacy guarantee. Dataset D goes through an analysis M and produces output O. Dataset D prime, which is D plus Alice's data, goes through the same analysis M and produces output O prime. The two outputs are similar, so the result does not reveal whether Alice's data was included.">
  <defs>
    <marker id="dp-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#4682B4"></path>
    </marker>
    <!-- a dataset: a stack of records with the data itself on top -->
    <g id="dp-db">
      <rect x="-58" y="-52" width="116" height="30" rx="6" fill="#F0A830" stroke="#CC7000" stroke-width="1.6"></rect>
      <rect x="-24" y="-44" width="48" height="14" rx="3" fill="#CC7000"></rect>
      <rect x="-58" y="-16" width="116" height="28" rx="6" fill="#FFFFFF" stroke="#5F6672" stroke-width="1.6"></rect>
      <rect x="-58" y="18" width="116" height="28" rx="6" fill="#FFFFFF" stroke="#5F6672" stroke-width="1.6"></rect>
      <g fill="#F0A830"><rect x="-48" y="-8" width="12" height="12" rx="2"></rect><rect x="-48" y="26" width="12" height="12" rx="2"></rect></g>
      <g fill="#8D949E"><circle cx="-20" cy="-2" r="2.4"></circle><circle cx="-10" cy="-2" r="2.4"></circle><circle cx="0" cy="-2" r="2.4"></circle><circle cx="-20" cy="32" r="2.4"></circle><circle cx="-10" cy="32" r="2.4"></circle><circle cx="0" cy="32" r="2.4"></circle></g>
      <g fill="#CC7000"><rect x="20" y="-5" width="30" height="6" rx="3"></rect><rect x="20" y="29" width="30" height="6" rx="3"></rect></g>
    </g>
    <!-- the analysis: a document under a magnifier -->
    <g id="dp-analysis">
      <rect x="-34" y="-44" width="56" height="72" rx="5" fill="#FBE0B4" stroke="#CC7000" stroke-width="1.6"></rect>
      <rect x="-46" y="-36" width="56" height="72" rx="5" fill="#FFFFFF" stroke="#5F6672" stroke-width="1.6"></rect>
      <g stroke="#8D949E" stroke-width="2.4" stroke-linecap="round">
        <path d="M-36,-22 H0"></path><path d="M-36,-10 H0"></path><path d="M-36,2 H-14"></path>
      </g>
      <circle cx="2" cy="10" r="20" fill="#FFFFFF" fill-opacity="0.55" stroke="#5F6672" stroke-width="2.6"></circle>
      <path d="M16,24 L32,40" stroke="#5F6672" stroke-width="4.5" stroke-linecap="round"></path>
    </g>
  </defs>

  <!-- D, unchanged -->
  <use href="#dp-db" transform="translate(130,110)"></use>
  <text x="200" y="72" font-family="Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#333">D</text>
  <path d="M200,110 H352" stroke="#4682B4" stroke-width="2.4" stroke-dasharray="7 5" fill="none" marker-end="url(#dp-arrow)"></path>
  <use href="#dp-analysis" transform="translate(420,110)"></use>
  <text x="420" y="186" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#333">Analysis (M)</text>
  <path d="M478,110 H592" stroke="#4682B4" stroke-width="2.4" stroke-dasharray="7 5" fill="none" marker-end="url(#dp-arrow)"></path>
  <text x="608" y="104" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#333">Output</text>
  <text x="608" y="126" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#333">result O</text>

  <!-- the one data point that separates them -->
  <g font-family="Helvetica, Arial, sans-serif" text-anchor="middle" fill="#333">
    <text x="130" y="216" font-size="24" font-weight="700">+</text>
    <text x="130" y="248" font-size="16">Alice's data</text>
    <text x="130" y="284" font-size="24" font-weight="700">=</text>
  </g>

  <!-- D prime, one record larger -->
  <use href="#dp-db" transform="translate(130,378)"></use>
  <rect x="72" y="430" width="116" height="28" rx="6" fill="#EAF1F7" stroke="#4682B4" stroke-width="1.8"></rect>
  <text x="130" y="449" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#4682B4">Alice</text>
  <text x="200" y="340" font-family="Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#333">D′</text>
  <path d="M200,378 H352" stroke="#4682B4" stroke-width="2.4" stroke-dasharray="7 5" fill="none" marker-end="url(#dp-arrow)"></path>
  <use href="#dp-analysis" transform="translate(420,378)"></use>
  <text x="420" y="454" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#333">Analysis (M)</text>
  <path d="M478,378 H592" stroke="#4682B4" stroke-width="2.4" stroke-dasharray="7 5" fill="none" marker-end="url(#dp-arrow)"></path>
  <text x="608" y="372" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#333">Output</text>
  <text x="608" y="394" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#333">result O′</text>

  <!-- and yet the two results look alike -->
  <text x="612" y="252" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="34" font-weight="700" fill="#5F6672">≈</text>
  <text x="640" y="238" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#333">Outputs O and O′</text>
  <text x="640" y="260" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#333">are similar</text>
</svg>