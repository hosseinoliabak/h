<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 716" style="width:75%;max-width:100%;height:auto;" role="img" aria-label="The same federated learning system, showing both directions of a round. Blue broadcasting arrows carry the global model from the server down to each of the five clients, and orange uploading arrows carry the updated parameters from each client back up to the server, where an aggregation strategy such as FedAvg, QFedAvg or FedAdam combines them into a new global model.">
  <defs>
    <marker id="fl-down" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#4682B4"></path>
    </marker>
    <marker id="fl-up" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#CC5500"></path>
    </marker>
    <g id="agg-model">
      <g stroke="#CC7000" stroke-width="1.6" fill="none">
        <path d="M0,-17 L14.7,-8.5 L14.7,8.5 L0,17 L-14.7,8.5 L-14.7,-8.5 Z"></path>
        <path d="M0,0 L0,-17 M0,0 L14.7,-8.5 M0,0 L14.7,8.5 M0,0 L0,17 M0,0 L-14.7,8.5 M0,0 L-14.7,-8.5"></path>
      </g>
      <g fill="#F0A830" stroke="#CC7000" stroke-width="1.2">
        <circle cx="0" cy="-17" r="3.2"></circle><circle cx="14.7" cy="-8.5" r="3.2"></circle>
        <circle cx="14.7" cy="8.5" r="3.2"></circle><circle cx="0" cy="17" r="3.2"></circle>
        <circle cx="-14.7" cy="8.5" r="3.2"></circle><circle cx="-14.7" cy="-8.5" r="3.2"></circle>
      </g>
      <circle cx="0" cy="0" r="4.2" fill="#CC7000"></circle>
    </g>
    <g id="agg-data">
      <path d="M-11,-13 a11,4.5 0 0 1 22,0 v26 a11,4.5 0 0 1 -22,0 Z" fill="#F0A830" stroke="#CC7000" stroke-width="1.4"></path>
      <ellipse cx="0" cy="-13" rx="11" ry="4.5" fill="#FBE0B4" stroke="#CC7000" stroke-width="1.4"></ellipse>
    </g>
  </defs>

  <!-- global model, produced by aggregation -->
  <rect x="380" y="18" width="140" height="124" rx="10" fill="#F7F7FA" stroke="#B0B4BC" stroke-width="1.4" stroke-dasharray="5 4"></rect>
  <use href="#agg-model" transform="translate(450,80) scale(1.5)"></use>
  <text x="352" y="86" text-anchor="end" font-family="Helvetica, Arial, sans-serif" font-size="19" font-weight="600" fill="#333">Global Model</text>
  <path d="M450,190 V148" stroke="#CC5500" stroke-width="2.4" stroke-dasharray="8 6" fill="none" marker-end="url(#fl-up)"></path>

  <!-- server -->
  <rect x="352" y="206" width="196" height="46" rx="8" fill="#EDEFF2" stroke="#8D949E" stroke-width="1.6"></rect>
  <rect x="352" y="256" width="196" height="46" rx="8" fill="#EDEFF2" stroke="#8D949E" stroke-width="1.6"></rect>
  <rect x="404" y="196" width="92" height="34" rx="6" fill="#5F6672" stroke="#4A505A" stroke-width="1.4"></rect>
  <use href="#agg-model" transform="translate(450,213) scale(0.85)"></use>
  <g fill="#2E8B57"><rect x="512" y="224" width="22" height="7" rx="3"></rect><rect x="512" y="274" width="22" height="7" rx="3"></rect></g>
  <g fill="#8D949E"><circle cx="470" cy="228" r="2.4"></circle><circle cx="480" cy="228" r="2.4"></circle><circle cx="490" cy="228" r="2.4"></circle><circle cx="470" cy="278" r="2.4"></circle><circle cx="480" cy="278" r="2.4"></circle><circle cx="490" cy="278" r="2.4"></circle></g>
  <text x="330" y="262" text-anchor="end" font-family="Helvetica, Arial, sans-serif" font-size="19" font-weight="600" fill="#333">Server</text>

  <!-- the interchangeable part: the aggregation strategy -->
  <g fill="#F7F7FA" stroke="#B0B4BC" stroke-width="1.4">
    <rect x="606" y="186" width="152" height="36" rx="8"></rect>
    <rect x="606" y="230" width="152" height="36" rx="8"></rect>
    <rect x="606" y="274" width="152" height="36" rx="8"></rect>
  </g>
  <g font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#333" text-anchor="middle">
    <text x="682" y="210">FedAvg</text>
    <text x="682" y="254">QFedAvg</text>
    <text x="682" y="298">FedAdam</text>
    <text x="682" y="326" font-size="18" fill="#8D949E">. . .</text>
  </g>

  <!-- uploading: client updates travel back up to the server -->
  <g fill="none" stroke="#CC5500" stroke-width="2.2" stroke-dasharray="7 5">
    <path d="M124,424 V348 H804 V424"></path>
    <path d="M294,424 V348"></path>
    <path d="M634,424 V348"></path>
    <path d="M804,348 H124"></path>
    <path d="M464,424 V310" marker-end="url(#fl-up)"></path>
  </g>

  <!-- broadcasting: the global model goes out to every client -->
  <g fill="none" stroke="#4682B4" stroke-width="2.2" stroke-dasharray="7 5">
    <path d="M436,304 V380"></path>
    <path d="M96,380 H776"></path>
    <path d="M96,380 V420" marker-end="url(#fl-down)"></path>
    <path d="M266,380 V420" marker-end="url(#fl-down)"></path>
    <path d="M436,380 V420" marker-end="url(#fl-down)"></path>
    <path d="M606,380 V420" marker-end="url(#fl-down)"></path>
    <path d="M776,380 V420" marker-end="url(#fl-down)"></path>
  </g>

  <!-- clients -->
  <g fill="#F7F7FA" stroke="#B0B4BC" stroke-width="1.4" stroke-dasharray="5 4">
    <rect x="40" y="430" width="140" height="180" rx="10"></rect>
    <rect x="210" y="430" width="140" height="180" rx="10"></rect>
    <rect x="380" y="430" width="140" height="180" rx="10"></rect>
    <rect x="550" y="430" width="140" height="180" rx="10"></rect>
    <rect x="720" y="430" width="140" height="180" rx="10"></rect>
  </g>
  <use href="#agg-model" transform="translate(110,468) scale(0.85)"></use>
  <use href="#agg-model" transform="translate(280,468) scale(0.85)"></use>
  <use href="#agg-model" transform="translate(450,468) scale(0.85)"></use>
  <use href="#agg-model" transform="translate(620,468) scale(0.85)"></use>
  <use href="#agg-model" transform="translate(790,468) scale(0.85)"></use>

  <rect x="82" y="512" width="56" height="80" rx="7" fill="#FFFFFF" stroke="#5F6672" stroke-width="1.8"></rect>
  <use href="#agg-data" transform="translate(110,552)"></use>

  <rect x="238" y="512" width="84" height="60" rx="5" fill="#FFFFFF" stroke="#5F6672" stroke-width="1.8"></rect>
  <path d="M272,572 h16 v14 h-16 Z M258,592 h44" fill="#FFFFFF" stroke="#5F6672" stroke-width="1.8"></path>
  <use href="#agg-data" transform="translate(280,542) scale(0.86)"></use>

  <rect x="432" y="510" width="36" height="80" rx="7" fill="#FFFFFF" stroke="#5F6672" stroke-width="1.8"></rect>
  <use href="#agg-data" transform="translate(450,550) scale(0.72)"></use>

  <rect x="586" y="510" width="68" height="52" rx="4" fill="#FFFFFF" stroke="#5F6672" stroke-width="1.8"></rect>
  <path d="M574,570 h92 l-8,-8 h-76 Z" fill="#FFFFFF" stroke="#5F6672" stroke-width="1.8" stroke-linejoin="round"></path>
  <use href="#agg-data" transform="translate(620,536) scale(0.78)"></use>

  <g fill="#FFFFFF" stroke="#5F6672" stroke-width="1.8">
    <rect x="742" y="536" width="96" height="30" rx="5"></rect>
    <rect x="742" y="576" width="96" height="30" rx="5"></rect>
  </g>
  <g fill="#F0A830"><rect x="752" y="546" width="11" height="11" rx="2"></rect><rect x="752" y="586" width="11" height="11" rx="2"></rect></g>
  <g fill="#CC7000"><rect x="800" y="549" width="28" height="5" rx="2.5"></rect><rect x="800" y="589" width="28" height="5" rx="2.5"></rect></g>
  <g fill="#8D949E"><circle cx="772" cy="551" r="2.2"></circle><circle cx="780" cy="551" r="2.2"></circle><circle cx="788" cy="551" r="2.2"></circle><circle cx="772" cy="591" r="2.2"></circle><circle cx="780" cy="591" r="2.2"></circle><circle cx="788" cy="591" r="2.2"></circle></g>
  <use href="#agg-data" transform="translate(790,512) scale(0.78)"></use>

  <text x="450" y="640" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="19" font-weight="600" fill="#333">Clients</text>

  <!-- legend -->
  <g font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#333">
    <rect x="40" y="662" width="15" height="15" rx="2" fill="#CC5500"></rect>
    <text x="66" y="675">Uploading</text>
    <rect x="40" y="688" width="15" height="15" rx="2" fill="#4682B4"></rect>
    <text x="66" y="701">Broadcasting</text>
  </g>
</svg>